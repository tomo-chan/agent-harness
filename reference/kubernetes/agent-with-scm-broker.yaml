apiVersion: v1
kind: Pod
metadata:
  name: agent-worker
  labels:
    app: agent-worker
spec:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: example.invalid/agent-harness:latest
      command:
        - python3
        - /workspace/agent-harness/reference/launcher/sandbox_first.py
        - --
        - codex
      env:
        - name: AGENT_HARNESS_GITHUB_TOKEN_FILE
          value: /run/secrets/scm/token
        - name: AGENT_HARNESS_SCM_SOCKET
          value: /run/agent-harness/scm.sock
        - name: SCM_BROKER_SOCKET
          value: /run/agent-harness/scm.sock
        - name: SCM_BROKER_WORKSPACE_ROOT
          value: /workspace
        - name: SCM_BROKER_REPOSITORY
          value: owner/repository
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: runtime
          mountPath: /run/agent-harness
        - name: scm-credential
          mountPath: /run/secrets/scm
          readOnly: true
        - name: tmp
          mountPath: /tmp

  volumes:
    - name: workspace
      emptyDir: {}
    - name: runtime
      emptyDir: {}
    - name: tmp
      emptyDir: {}
    - name: scm-credential
      secret:
        secretName: scm-broker-github
        defaultMode: 0400

---
apiVersion: v1
kind: Secret
metadata:
  name: scm-broker-github
stringData:
  # Reference only. Prefer a short-lived GitHub App installation token supplied
  # by an external secret/credential provider rather than a long-lived PAT.
  token: REPLACE_WITH_SHORT_LIVED_INSTALLATION_TOKEN

# Single Pod, single container:
#
#   trusted launcher
#      ├─ starts the narrow SCM helper OUTSIDE the agent's command sandbox
#      │    └─ helper alone receives the GitHub token
#      └─ removes credential variables and execs Codex/Devin
#           └─ agent tool commands run inside the vendor sandbox
#                └─ remote git/gh operations use the Unix socket shim
#
# The secret is mounted in the container because the trusted launcher/helper need
# it, but the vendor sandbox must deny/unmount /run/secrets/scm from agent-executed
# commands. Claude Code should prefer its native credential masking instead and
# does not need this fallback helper when masking is available.
