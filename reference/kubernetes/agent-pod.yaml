apiVersion: v1
kind: Pod
metadata:
  name: agent-worker
  labels:
    app: agent-worker
spec:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: example.invalid/agent-harness:latest
      workingDir: /workspace
      command: ["sleep", "infinity"]
      env:
        - name: AGENT_HARNESS_TRUSTED_ROOT
          value: /opt/agent-harness
        - name: AGENT_HARNESS_TRUSTED_POLICY
          value: /opt/agent-harness/reference/policies/policy.example.json
        - name: AGENT_HARNESS_TRUSTED_REPOSITORY_SECURITY_POLICY
          value: /opt/agent-harness/reference/policies/repository-security.example.json
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: workspace
      emptyDir: {}
    - name: tmp
      emptyDir: {}

# Production assurance notes:
# - keep one Pod / one unprivileged agent container unless a concrete threat model requires more isolation;
# - pin the image by digest and bake the approved harness snapshot into /opt/agent-harness;
# - never populate /opt/agent-harness from /workspace or another agent-writable volume;
# - readOnlyRootFilesystem keeps the baked /opt/agent-harness outside the mutable workspace boundary;
# - provision AGENT_HARNESS_TRUSTED_EXPECTED_REPOSITORY from trusted deployment configuration when repository identity must be fixed;
# - project-local vendor hook files are reference wiring; managed/trusted registration should invoke /opt/agent-harness/reference/launcher/trusted_hook.py where supported;
# - do not mount Docker/container-runtime sockets or hostPath volumes;
# - use workload identity only when required and bind it to minimum external permissions;
# - prefer short-lived, repository-scoped SCM credentials with least privilege and GitHub-side rulesets;
# - credential compromise remains a possible failure mode; Sandbox, IAM, and SCM server-side controls contain its blast radius.
