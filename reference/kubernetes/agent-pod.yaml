apiVersion: v1
kind: Pod
metadata:
  name: agent-worker
  labels:
    app: agent-worker
spec:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: example.invalid/agent-harness:latest
      workingDir: /workspace
      command: ["sleep", "infinity"]
      env:
        - name: AGENT_HARNESS_TRUSTED_ROOT
          value: /opt/agent-harness
        - name: AGENT_HARNESS_POLICY
          value: /opt/agent-harness/reference/policies/policy.example.json
        - name: AGENT_HARNESS_REPOSITORY_SECURITY_POLICY
          value: /opt/agent-harness/reference/policies/repository-security.example.json
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: workspace
      emptyDir: {}
    - name: tmp
      emptyDir: {}

# Production notes:
# - keep the baseline one Pod / one agent container unless a concrete threat model requires more isolation;
# - replace the placeholder image and pin it by digest;
# - bake the approved harness snapshot into /opt/agent-harness in the image; do not populate that path from /workspace;
# - keep /opt/agent-harness on the read-only root filesystem so agent-controlled Git operations cannot replace policy/posture/hook code;
# - provision vendor hook registration from trusted launcher/managed configuration where the vendor supports it; project-local hook files are reference wiring, not an independent authority boundary;
# - use workload identity only when cloud access is required;
# - do not mount Docker/container-runtime sockets or hostPath volumes;
# - prefer a dedicated ServiceAccount with minimum RBAC/IAM;
# - prefer short-lived, repository-scoped SCM credentials and GitHub-side rulesets;
# - treat credential compromise as a contained failure mode, not as a reason to add privileged sidecars by default.
