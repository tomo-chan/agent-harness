name: harness-tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest reference/hooks/tests reference/harness/tests reference/posture/tests -q
      - name: Validate JSON configuration
        run: |
          python -m json.tool .claude/settings.json >/dev/null
          python -m json.tool .codex/hooks.json >/dev/null
          python -m json.tool .devin/hooks.v1.json >/dev/null
          python -m json.tool .devin/config.json >/dev/null
          python -m json.tool reference/claude/managed-settings.example.json >/dev/null
          python -m json.tool reference/policies/policy.example.json >/dev/null
          python -m json.tool reference/policies/repository-security.example.json >/dev/null
