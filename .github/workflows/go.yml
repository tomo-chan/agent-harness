name: Agent Harness Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Build distribution candidate
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -o dist/agent-harness .
          ./dist/agent-harness version > dist/build-info.json
          (cd dist && shasum -a 256 agent-harness build-info.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: agent-harness-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
